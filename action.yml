name: 'Clone Github Repo Action'

description: "Github Action to clone a public or private Github repository and access its content on others repositories' workflows."

inputs:
  repository:
    description: 'Repository name'
    default: ${{ github.repository }}
  actor:
    description: 'The GitHub username identifying the user who triggered or initiated the current GitHub Actions workflow run'
    required: false
    default: ${{ github.actor }}
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false
    default: ${{ github.token }}
  depth:
    description: 'Depth of the clone (default: full history)'
    required: false
    default: ""
  branch:
    description: 'Branch name (default: github.ref_name)'
    required: false
  submodule:
    description: 'Clone with submodules'
    required: false
    default: "false"
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to place the repository'
    required: false
    default: "."

runs:
  using: 'composite'
  steps:
    - name: Resolve branch name
      id: branch-checker
      shell: bash
      run: |
        if [ -n "${{ inputs.branch }}" ]; then
          branch="${{ inputs.branch }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          branch="${{ github.head_ref }}"
        else
          branch="${{ github.ref_name }}"
        fi
        echo "Resolved branch: $branch"
        echo "resolved-branch=$branch" >> "$GITHUB_OUTPUT"

    - name: Clone repository
      run: |
        if [ -z "${{ inputs.access-token }}" ]; then
          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        elif [ -n "${{ inputs.actor }}" ]; then
          echo "Actor found ${{ inputs.actor }}."
          echo "Enable credential cache found."
          git config --global credential.helper cache

          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        else
          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "${{ steps.branch-checker.outputs.resolved-branch }}" --depth="${{ inputs.depth }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        fi
      shell: bash

branding:
  icon: 'download'
  color: 'blue'
