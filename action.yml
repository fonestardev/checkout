name: 'Clone Github Repo Action'

description: "Github Action to clone a public or private Github repository and access its content on others repositories' workflows."

inputs:
  repository:
    description: 'Repository name'
    default: ${{ github.repository }}
  actor:
    description: 'The GitHub username identifying the user who triggered or initiated the current GitHub Actions workflow run'
    required: false
    default: ${{ github.actor }}
  access-token:
    description: 'PAT with repository scope (https://github.com/settings/tokens)'
    required: false
    default: ${{ github.token }}
  depth:
    description: 'Depth of the clone (default: full history)'
    required: false
    default: ""
  branch:
    description: 'Branch name (default: github.ref_name)'
    required: false
  submodule:
    description: 'Clone with submodules'
    required: false
    default: "false"
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to place the repository'
    required: false
    default: "."

runs:
  using: 'composite'
  steps:
    - name: Resolve branch name (bash)
      id: branch-checker
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ -n "${{ inputs.branch }}" ]; then
          branch="${{ inputs.branch }}"
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          branch="${{ github.head_ref }}"
        else
          branch="${{ github.ref_name }}"
        fi
        echo "Resolved branch: $branch"
        echo "resolved-branch=$branch" >> "$GITHUB_OUTPUT"

    - name: Resolve branch name (pwsh)
      id: branch-checker-win
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ("${{ inputs.branch }}" -ne "") {
          $branch = "${{ inputs.branch }}"
        } elseif ("${{ github.event_name }}" -eq "pull_request") {
          $branch = "${{ github.head_ref }}"
        } else {
          $branch = "${{ github.ref_name }}"
        }
        Write-Output "Resolved branch: $branch"
        "resolved-branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Clone repository (bash)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        RESOLVED_BRANCH="${{ steps.branch-checker.outputs.resolved-branch }}"
        REPO_DIR="${{ inputs.path }}/$(basename ${{ inputs.repository }})"
        if [ -d "$REPO_DIR" ]; then
          rm -rf "$REPO_DIR"
        fi
        if [ -z "${{ inputs.access-token }}" ]; then
          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" https://github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" https://github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        elif [ -n "${{ inputs.actor }}" ]; then
          echo "Actor found ${{ inputs.actor }}."
          echo "Enable credential cache found."
          git config --global credential.helper cache

          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://${{ inputs.actor }}:${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        else
          if [ -z "${{ inputs.depth }}" ]; then
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          else
            if [ "${{ inputs.submodule }}" = "true" ]; then
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git --recursive ${{ inputs.path }}
            else
              git clone --branch "$RESOLVED_BRANCH" --depth="${{ inputs.depth }}" https://${{ inputs.access-token }}@github.com/${{ inputs.repository }}.git ${{ inputs.path }}
            fi
          fi
        fi

    - name: Clone repository (pwsh)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $resolvedBranch = "${{ steps.branch-checker-win.outputs.resolved-branch }}"
        $repoName = "${{ inputs.repository }}" -split '/' | Select-Object -Last 1
        $repoDir = Join-Path "${{ inputs.path }}" $repoName
        if (Test-Path $repoDir) {
          Remove-Item -Recurse -Force $repoDir
        }
        $depth = "${{ inputs.depth }}"
        $submodule = "${{ inputs.submodule }}"
        $actor = "${{ inputs.actor }}"
        $token = "${{ inputs.access-token }}"
        $repo = "${{ inputs.repository }}"
        $clonePath = "${{ inputs.path }}"

        function Invoke-Clone($url) {
          $args = @("clone", "--branch", $resolvedBranch)
          if ($depth -ne "") { $args += "--depth=$depth" }
          $args += $url
          if ($submodule -eq "true") { $args += "--recursive" }
          $args += $clonePath
          & git @args
        }

        if ($token -eq "") {
          Invoke-Clone "https://github.com/$repo.git"
        } elseif ($actor -ne "") {
          Write-Output "Actor found $actor."
          Write-Output "Enable credential cache found."
          git config --global credential.helper cache
          Invoke-Clone "https://${actor}:${token}@github.com/$repo.git"
        } else {
          Invoke-Clone "https://${token}@github.com/$repo.git"
        }

branding:
  icon: 'download'
  color: 'blue'
